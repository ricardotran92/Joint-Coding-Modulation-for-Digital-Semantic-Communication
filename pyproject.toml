[project]
name = "semantic-communication"
version = "0.1.0"
description = "semantic-communication"
authors = [
    {name = "ricardo"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "matplotlib (>=3.8,<4)",
    "numpy (>=1.26,<3)",
    "pandas (>=2.2,<3)",
    "scikit-learn (>=1.4,<2)",
    "scipy (>=1.13,<2)",
    "scikit-image (>=0.22,<1)",
    "torch (>=2.4)",
    "torchvision (>=0.19)",
    "tqdm (>=4.65)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)"
]
